name: 유료방송 뉴스 자동 갱신

on:
  schedule:
    # 사용자 요청으로 3시간 -> 6시간 간격으로 변경(2026-08-28).
    # 한국시간(KST) 기준 00:00 / 06:00 / 12:00 / 18:00에 돌도록 맞춤.
    # KST는 UTC+9라서 UTC로 환산하면 전날 15:00 / 21:00 / 03:00 / 09:00 = UTC 3,9,15,21시
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼으로도 테스트 가능
  push:
    branches: [main]      # 코드를 고칠 때 바로 한 번 돌려서 확인하기 위함
                           # (GITHUB_TOKEN으로 만든 커밋은 다시 push 이벤트를 만들지 않아 무한루프 안 남)

permissions:
  contents: write   # 이 저장소에 커밋/푸시하려면 필요

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 뉴스 수집 스크립트 실행
        shell: pwsh
        run: ./collect_news.ps1

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html news_history.json collect_log.txt
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 생략"
          else
            git commit -m "뉴스 자동 갱신 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:main
          fi
